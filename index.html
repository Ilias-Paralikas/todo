<!doctype html>
<!-- Todo. Read DECISIONS.md before changing this file, and update it in the same commit. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<title>Todo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/AtkinsonHyperlegibleNext.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Atkinson Hyperlegible Next";
  src: url("fonts/AtkinsonHyperlegibleNext.woff2") format("woff2");
  font-weight: 200 800;
  font-display: swap;
}
:root {
  color-scheme: light dark;
  --page: #f3f5f7;  --field: #ffffff;  --ink: #1b2433;  --muted: #687384;
  --line: #dce1e7;  --danger: #b3261e;
  --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #10161d;  --field: #18212b;  --ink: #e8ecf1;  --muted: #8f9aa9;
    --line: #2a3542;  --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 420 17px/1.45 var(--font);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .3; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.page {
  max-width: 38rem; margin: 0 auto;
  padding: max(1rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
           max(2rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
}

/* Priority: open tasks come in groups, each under a labelled line; High is bolder, Low is grey (DECISIONS D34). */
.p1 .title { font-weight: 660; }
.p3 .title { color: var(--muted); }
.group { display: flex; align-items: center; gap: .6rem; margin: 1rem 0 .15rem; font-size: .75rem; font-weight: 650;
         letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.group::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.group:first-child { margin-top: 0; }

/* List tabs. They wrap rather than scroll, so every list stays in sight. */
.tabs { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem 1.15rem; padding: .5rem 0 1rem; }
.tab, .tab-add { font-size: 1.25rem; font-weight: 300; color: var(--muted); border-bottom: 3px solid transparent; }
.tab[aria-current="page"] { font-weight: 760; color: var(--ink); border-color: var(--c); }
.tab-name { display: inline-flex; flex-direction: column; align-items: center; }
.tab-name::after { content: attr(data-text); font-weight: 760; height: 0; overflow: hidden; visibility: hidden; } /* reserve bold width: no jumping */
.tab sup { margin-left: .1rem; font-size: .7rem; font-weight: 600; }
.tab-add { position: relative; padding: 0 .35rem; }
.tab-add::after { content: ""; position: absolute; inset: -.6rem -.4rem; } /* bigger touch target */
.status { margin: -.5rem 0 .75rem; font-size: .88rem; color: var(--muted); }

/* Fields and buttons */
.field { width: 100%; min-width: 0; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
.field:focus { outline: none; border-color: var(--ink); }
.btn { padding: .65rem 1.1rem; border-radius: 12px; font-weight: 650; }
.btn-primary { background: var(--ink); color: var(--page); }
.btn-plain { color: var(--muted); }
.btn-danger { padding-left: 0; color: var(--danger); }

/* New-task composer and the list/priority pickers */
.composer { display: grid; grid-template-columns: 1fr auto; gap: .6rem; margin-bottom: 1.1rem; }
.composer:not(.typing) :is(.btn-add, .opts) { display: none; }
.opts { grid-column: 1 / -1; display: grid; gap: .55rem; }
.picks { display: grid; gap: .55rem; }
.price { width: 10rem; justify-self: start; }
.chips, .prios { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip, .prio { padding: .3rem .65rem; border: 1px solid var(--line); border-radius: 999px; font-size: .92rem; }
.chip { display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.prio { border-color: transparent; }
.prio[aria-pressed="true"] { border-color: var(--ink); }
.chip::before, .tag::before { content: ""; flex: none; width: .55rem; height: .55rem; border-radius: 50%; background: var(--c); }
.tag.in::before { content: "↳"; width: auto; height: auto; background: none; }   /* the project of a subtask shown on its own */

/* Tasks */
.list { list-style: none; margin: 0; padding: 0; }
.task { display: flex; align-items: flex-start; gap: .85rem; padding: .5rem 0; }
.check { position: relative; flex: none; width: 1.4rem; height: 1.4rem; margin-top: .1rem;
         border: 2px solid var(--muted); border-radius: 50%; transition: background-color .15s, border-color .15s; }
.check::after { content: ""; position: absolute; inset: -.65rem; } /* bigger touch target */
.p1 .check { border-color: var(--ink); }
.check[aria-checked="true"] { background: var(--muted); border-color: var(--muted); }
.check[aria-checked="true"]::before { content: ""; position: absolute; left: .36rem; top: .14rem; width: .3rem; height: .62rem;
         border: solid var(--page); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.col { flex: 1; min-width: 0; }
.line { display: flex; align-items: flex-start; gap: .6rem; }
.body { flex: 1; min-width: 0; }
.title { overflow-wrap: anywhere; }
.aside { flex: none; margin-top: .05rem; font-size: .92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.expand { position: relative; flex: none; width: 1.5rem; height: 1.5rem; color: var(--muted); }
.expand::before { content: ""; position: absolute; left: .5rem; top: .4rem; width: .45rem; height: .45rem; border: solid currentColor;
                  border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; }
.expand[aria-expanded="true"]::before { transform: rotate(45deg); }
.expand::after { content: ""; position: absolute; inset: -.6rem; } /* bigger touch target */
.subs { list-style: none; margin: .3rem 0 0; padding: 0; }
.subs .task { padding: .3rem 0; }
.tags { display: flex; flex-wrap: wrap; gap: .15rem .9rem; margin-top: .1rem; font-size: .8rem; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: .35rem; }
.done .title { font-weight: 340; color: var(--muted); text-decoration: line-through; }
.empty { padding: 1.25rem 0; color: var(--muted); }
.total { margin: .5rem 0 0; padding-top: .5rem; border-top: 1px solid var(--line); text-align: right; font-weight: 650;
         font-variant-numeric: tabular-nums; }

/* Project page (D32) */
.project-head { margin-bottom: 1.1rem; }
.crumb { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .7rem; font-size: .92rem; font-weight: 600; color: var(--muted); }
.project-head .task { padding: 0; }
.project-head h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
.notes { margin: .7rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.done-box { margin-top: 1.5rem; }
.done-box summary { display: flex; align-items: center; gap: .6rem; padding: .35rem 0; font-weight: 600; color: var(--muted); cursor: pointer; list-style: none; }
.done-box summary::-webkit-details-marker { display: none; }
.done-box summary::before { content: ""; width: .45rem; height: .45rem; border: solid currentColor; border-width: 0 2px 2px 0;
         transform: rotate(-45deg); transition: transform .15s; }
.done-box[open] summary::before { transform: rotate(45deg); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 1.25rem; margin-top: 3rem; font-size: .85rem; color: var(--muted); }
.foot-actions { display: flex; flex-wrap: wrap; gap: .6rem 1.25rem; }
.foot button { text-decoration: underline; text-underline-offset: 3px; }

/* Dialogs: task editor and lists editor */
.editor { width: min(34rem, calc(100% - 2rem)); max-height: 84vh; margin: 12vh auto auto; padding: 1.1rem; overflow-y: auto;
          border: 1px solid var(--line); border-radius: 18px; background: var(--page); color: var(--ink); }
.editor::backdrop { background: rgb(16 22 29 / .5); }
.editor form { display: grid; gap: .9rem; }
.editor h2 { margin: 0; font-size: 1.25rem; font-weight: 720; }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: .4rem; }
.actions .btn-danger { margin-right: auto; }
.list-rows { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.list-row { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }   /* wraps only for the color grid */
.list-row .field { flex: 1; width: auto; }
.swatch { flex: none; width: 1.75rem; height: 1.75rem; margin-right: .25rem; border-radius: 50%; background: var(--c); }
.colors { flex-basis: 100%; display: grid; grid-template-columns: repeat(8, 1fr); gap: .5rem; padding: .4rem .2rem .6rem; }   /* D35 */
.colors button { aspect-ratio: 1; border-radius: 50%; background: var(--c); }
.colors [aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.icon-btn { flex: none; width: 2.1rem; height: 2.3rem; border-radius: 10px; font-size: 1.1rem; color: var(--muted); text-align: center; }
.add-list, .link { justify-self: start; padding: .2rem 0; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
textarea.field { resize: vertical; }

/* Sign-in, loading, messages */
.login { display: grid; gap: .75rem; max-width: 22rem; margin: 18vh auto 0; }
.login h1 { margin: 0; font-size: 2.6rem; font-weight: 780; line-height: 1.1; }
.hint { margin: 0 0 .5rem; color: var(--muted); }
.editor .hint { margin: 0; font-size: .88rem; }
.error { min-height: 1.45em; margin: 0; color: var(--danger); }
.boot { padding: 2rem 0; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
         width: max-content; max-width: calc(100% - 2rem); padding: .7rem 1rem; border-radius: 12px;
         background: var(--ink); color: var(--page); font-size: .92rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <p id="boot" class="boot">Loading…</p>

  <form id="login" class="login" hidden>
    <h1>Todo</h1>
    <p class="hint">Sign in with the account you created in Firebase.</p>
    <input class="field" name="email" type="email" autocomplete="username" placeholder="Email" required>
    <input class="field" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn btn-primary">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>

  <main id="main" hidden>
    <nav id="tabs" class="tabs" aria-label="Lists"></nav>
    <p id="status" class="status" role="status" hidden></p>
    <header id="project-head" class="project-head" hidden></header>
    <form id="add" class="composer">
      <input id="add-title" class="field" placeholder="Add a task" aria-label="New task" autocomplete="off" enterkeyhint="done" maxlength="300">
      <button class="btn btn-primary btn-add">Add</button>
      <div class="opts">
        <div id="add-opts" class="picks"></div>
        <input id="add-price" class="field price" placeholder="Price in €" aria-label="Price in euros" inputmode="decimal" autocomplete="off" enterkeyhint="done" maxlength="12">
      </div>
    </form>
    <ul id="list" class="list"></ul>
    <p id="total" class="total" hidden></p>
    <details id="done-box" class="done-box" hidden>
      <summary id="done-summary"></summary>
      <ul id="done-list" class="list"></ul>
    </details>
    <footer class="foot">
      <span id="who"></span>
      <span class="foot-actions">
        <button data-act="backup">Download backup</button>
        <button data-act="restore">Restore backup</button>
        <button data-act="signout">Sign out</button>
      </span>
      <input id="restore-file" type="file" accept=".json,application/json" hidden>
    </footer>
  </main>
</div>

<dialog id="editor" class="editor" aria-label="Edit task">
  <form id="edit-form">
    <input id="edit-title" class="field" aria-label="Task" autocomplete="off" maxlength="300" required>
    <textarea id="edit-notes" class="field" rows="4" placeholder="Description" aria-label="Description" maxlength="5000"></textarea>
    <div id="edit-opts" class="picks"></div>
    <input id="edit-price" class="field price" placeholder="Price in €" aria-label="Price in euros" inputmode="decimal" autocomplete="off" maxlength="12">
    <button type="button" id="make-project" class="link" data-act="makeProject">Make it a project</button>
    <div class="actions">
      <button type="button" class="btn btn-danger" data-act="deleteTask">Delete</button>
      <button type="button" class="btn btn-plain" data-act="close">Cancel</button>
      <button class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="lists-editor" class="editor" aria-labelledby="lists-heading">
  <form id="lists-form">
    <h2 id="lists-heading">Lists</h2>
    <ul id="lists-rows" class="list-rows"></ul>
    <button type="button" class="add-list" data-act="addList">Add a list</button>
    <p class="hint">Tap a dot to pick a color. Deleting a list keeps its tasks in All. To buy stays: it collects everything with a price.</p>
    <div class="actions">
      <button type="button" class="btn btn-plain" data-act="close">Cancel</button>
      <button class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module">
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Lists are data, not code: add, rename, recolor, reorder or delete them in the app with
// the + after the tabs (D9). These are only the lists created at the very first sign-in (D10).
const DEFAULT_LISTS = [
  { id: 'work',    name: 'Work',    color: '#3559a8' },
  { id: 'hobbies', name: 'Hobbies', color: '#a0458a' },
  { id: 'gym',     name: 'Gym',     color: '#23876a' },
  { id: 'buy',     name: 'To buy',  color: '#c27414' },
];
const PALETTE = ['#3559a8', '#a0458a', '#23876a', '#c27414', '#6a55c8', '#b5473a', '#2a7d9a', '#6f7f24',   // list colors,
                 '#d0604a', '#c2417a', '#8e44ad', '#3b7dd8', '#4f9a2e', '#b08a14', '#8a5a3c', '#5b6b7f'];  // picked from a grid (D9, D35)
const SHOPPING_LIST = 'buy';   // the To buy list: typing a price ticks it (D33)
const PRIOS = [{ id: 1, label: 'High' }, { id: 2, label: 'Normal' }, { id: 3, label: 'Low' }];   // fixed levels (D12)
const DEFAULT_PRIO = 2;
const DONE_TTL_DAYS = 30;                                  // completed tasks are deleted after this (D13)
const SDK = 'https://www.gstatic.com/firebasejs/12.19.0';  // Firebase JS SDK, pinned (D2)

// ─── STORE: the only code that talks to Firebase ─────────────────────────────
// To change backend, rewrite this section and keep the methods it returns.
const appError = code => Object.assign(new Error(code), { code });
const load = (url, code) => import(url).catch(() => { throw appError(code); });

async function connectStore(onError) {
  const { FIREBASE_CONFIG: config } = await load('./firebase-config.js', 'app/config-missing');
  if (!config?.apiKey || config.apiKey.startsWith('PASTE')) throw appError('app/config-empty');
  const [{ initializeApp }, A, F] = await Promise.all(
    ['app', 'auth', 'firestore'].map(name => load(`${SDK}/firebase-${name}.js`, 'app/sdk-offline')));

  const app = initializeApp(config);
  const auth = A.getAuth(app);
  const db = F.initializeFirestore(app, {   // on-device copy: reads work offline, writes queue (D16)
    localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }),
  });
  let tasks = null, settings = null;   // users/{uid}/tasks and users/{uid}/settings/app (D6)
  const ref = id => F.doc(tasks, id);
  const write = promise => { promise.catch(onError); };   // never awaited (D14)
  const inBatches = (items, add) => {   // a Firestore batch holds at most 500 writes
    for (let i = 0; i < items.length; i += 400) {
      const batch = F.writeBatch(db);
      items.slice(i, i + 400).forEach(item => add(batch, item));
      write(batch.commit());
    }
  };

  return {
    onUser: callback => A.onAuthStateChanged(auth, user => {
      tasks = user && F.collection(db, 'users', user.uid, 'tasks');
      settings = user && F.doc(db, 'users', user.uid, 'settings', 'app');
      callback(user);
    }),
    signIn: (email, password) => A.signInWithEmailAndPassword(auth, email, password),
    signOut: () => A.signOut(auth),
    watch: (onTasks, onSettings, onFail) => {
      const options = { includeMetadataChanges: true };
      const stops = [
        F.onSnapshot(tasks, options, snap => onTasks(snap.docs.map(d => ({ ...d.data(), id: d.id })), snap.metadata), onFail),
        F.onSnapshot(settings, options, snap => onSettings(snap.exists() ? snap.data() : null, snap.metadata), onFail),
      ];
      return () => stops.forEach(stop => stop());
    },
    add: task => write(F.setDoc(F.doc(tasks), task)),
    patch: (id, fields) => write(F.updateDoc(ref(id), fields)),
    patchMany: items => inBatches(items, (batch, { id, ...fields }) => batch.update(ref(id), fields)),
    remove: id => write(F.deleteDoc(ref(id))),
    removeMany: ids => inBatches(ids, (batch, id) => batch.delete(ref(id))),
    putMany: items => inBatches(items, (batch, { id, ...task }) => batch.set(ref(id), task)),
    saveSettings: fields => write(F.setDoc(settings, fields, { merge: true })),
  };
}

// ─── STATE & ACTIONS ─────────────────────────────────────────────────────────
// Data changes go through actions. The screen updates only from snapshots, our own
// writes included (D15): action → store → snapshot → render().
const local = {   // per-device settings, not synced (D25)
  get: key => { try { return localStorage.getItem(key); } catch { return null; } },
  set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
};
const readSet = key => { try { return new Set(JSON.parse(local.get(key)) ?? []); } catch { return new Set(); } };
const state = {
  user: null,
  tasks: [],
  index: new Map(),     // the same tasks by id
  lists: [],            // list definitions, in tab order (D9)
  loaded: false,        // first task snapshot has arrived
  listsLoaded: false,   // lists are known (from the on-device copy or the server)
  offline: false,       // snapshots have come from the on-device copy for 3+ seconds (D18)
  queued: false,        // local changes the server hasn't confirmed yet
  view: local.get('view') || 'all',   // checked once the lists are known (D25)
  project: null,        // the project whose page is open, from the URL: #p=<id> (D32)
  expanded: readSet('expanded'),   // projects showing their subtasks in the lists, per device (D25, D32)
  draft: null,          // composer picks: { lists, prio }
  editing: null,        // task editor: { id, lists, prio }
  listsDraft: null,     // lists editor: working copy of state.lists
  picking: null,        // lists editor: the row whose color grid is open (D35)
};
// Defaults for missing or malformed fields (D31). Colors must be #rrggbb because they go into style attributes (D26).
const toTask = raw => ({ title: '', done: false, created: 0, doneAt: null, project: false, notes: '', parent: null, ...raw,
                         lists: Array.isArray(raw.lists) ? raw.lists : [],
                         prio: PRIOS.some(p => p.id === raw.prio) ? raw.prio : DEFAULT_PRIO,
                         price: Number.isInteger(raw.price) && raw.price >= 0 ? raw.price : null });
const toList = raw => ({ id: String(raw.id), name: String(raw.name ?? ''),
                         color: /^#[0-9a-f]{6}$/i.test(raw.color) ? raw.color : PALETTE[0] });
const listById = id => state.lists.find(list => list.id === id);
const byId = id => state.index.get(id);
// One level (D32): projects are never subtasks, and a subtask whose project is gone stands alone.
const parentOf = task => { const parent = !task.project && task.parent && byId(task.parent); return parent?.project ? parent : null; };
const subtasksOf = id => state.tasks.filter(t => parentOf(t)?.id === id);
const shownProject = () => { const task = state.project && byId(state.project); return task?.project ? task : null; };
// "4,50", "€4.50" or "4" → 450 (whole cents, D31); blank → null; anything else → NaN.
const parsePrice = text => {
  const s = text.replace(/[€\s]/g, '').replace(',', '.');
  return !s ? null : /^\d+(\.\d{1,2})?$/.test(s) ? Math.round(Number(s) * 100) : NaN;
};
const freshDraft = () => ({ lists: state.project || state.view === 'all' ? [] : [state.view], prio: DEFAULT_PRIO });
state.draft = freshDraft();
let store, unwatch, offlineTimer, pruned = false, pushed = false;   // pushed: we opened the project page, so Back can go back

const actions = {
  setView(view) {
    state.view = view;
    local.set('view', view);
    if (state.project) return actions.closeProject();
    state.draft = freshDraft();
    render();
    renderPickers();
  },
  openProject(id) { pushed = true; location.hash = `p=${encodeURIComponent(id)}`; },   // → route()
  closeProject() {   // back to the list, like the phone's back gesture
    if (pushed) return history.back();
    history.replaceState(null, '', location.pathname + location.search);
    route();
  },
  add(title, price) {
    title = title.trim();
    if (!title) return false;
    store.add({ title, lists: state.draft.lists, prio: state.draft.prio, done: false, created: Date.now(), doneAt: null,
                project: false, notes: '', parent: shownProject()?.id ?? null, price });
    state.draft = freshDraft();
    return true;
  },
  toggle(id) {   // completing a project completes its open subtasks too (D32)
    const task = byId(id);
    if (!task) return;
    const done = !task.done, doneAt = done ? Date.now() : null;
    const also = done ? subtasksOf(id).filter(t => !t.done) : [];
    store.patchMany([task, ...also].map(t => ({ id: t.id, done, doneAt })));
  },
  save(id, { title, notes, lists, prio, price }) {
    title = title.trim();
    if (!title) return false;
    store.patch(id, { title, notes, lists, prio, price });
    return true;
  },
  makeProject(id) { store.patch(id, { project: true }); actions.openProject(id); },   // D32
  expand(id) {
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    local.set('expanded', JSON.stringify([...state.expanded].filter(byId)));
    render();
  },
  remove(id) { store.removeMany([id, ...subtasksOf(id).map(t => t.id)]); },   // a project goes with its subtasks (D32)
  saveLists(draft) {   // D9, D11
    const before = new Map(state.lists.map(list => [list.id, list]));
    const lists = draft.map(list => ({ ...list, name: list.name.trim() || before.get(list.id)?.name || '' }))
      .filter(list => list.name);   // a blank new list isn't created; a blanked old one keeps its name
    const gone = state.lists.filter(list => !lists.some(kept => kept.id === list.id));
    if (gone.length && !confirm(`Delete ${gone.map(list => `"${list.name}"`).join(', ')}? `
      + 'Their tasks stay in All and in any other lists they are on.')) return false;
    store.saveSettings({ lists });
    return true;
  },
  prune() {   // D13
    const cutoff = Date.now() - DONE_TTL_DAYS * 864e5;
    const old = state.tasks.filter(t => t.done && t.doneAt && t.doneAt < cutoff);
    if (old.length) store.removeMany(old.map(t => t.id));
  },
  backup() {   // D20
    const data = { app: 'todo', exportedAt: new Date().toISOString(), lists: state.lists, tasks: state.tasks };
    const link = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' })),
      download: `todo-backup-${data.exportedAt.slice(0, 10)}.json`,
    });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  },
  restore(data) {   // merge: adds missing lists, writes tasks by id, deletes nothing (D20)
    if (!state.listsLoaded) return toast('Your lists are still loading. Try again in a moment.');
    const tasks = (Array.isArray(data?.tasks) ? data.tasks : [])
      .filter(t => typeof t?.id === 'string' && /^[^/]+$/.test(t.id) && typeof t.title === 'string').map(toTask);
    const lists = (Array.isArray(data?.lists) ? data.lists : [])
      .filter(l => typeof l?.id === 'string' && l.id !== 'all' && typeof l.name === 'string').map(toList);
    if (!tasks.length && !lists.length) return toast("That file isn't a Todo backup.");
    if (!confirm(`Restore ${tasks.length} tasks and ${lists.length} lists from this backup? `
      + 'Tasks with the same id are replaced. Nothing is deleted.')) return;
    store.saveSettings({ lists: [...state.lists, ...lists.filter(list => !listById(list.id))] });
    store.putMany(tasks);
    toast(`Restored ${tasks.length} tasks and ${lists.length} lists.`);
  },
};

function onUser(user) {
  unwatch?.();
  Object.assign(state, { user, tasks: [], index: new Map(), lists: [], loaded: false, listsLoaded: false, offline: false });
  unwatch = user ? store.watch(onTasks, onSettings, err => toast(explain(err))) : null;
  show(user ? 'main' : 'login');
  render();
  renderPickers();
}

function onTasks(docs, meta) {
  const tasks = docs.map(toTask);
  Object.assign(state, { tasks, index: new Map(tasks.map(t => [t.id, t])), loaded: true, queued: meta.hasPendingWrites });
  clearTimeout(offlineTimer);
  if (meta.fromCache) {   // every start begins from the on-device copy, so wait before calling it offline
    offlineTimer = setTimeout(() => { state.offline = true; render(); }, 3000);
  } else {
    state.offline = false;
    if (!pruned) { pruned = true; actions.prune(); }
  }
  render();
}

function onSettings(settings, meta) {
  if (!settings) {   // nothing saved yet. Only the server can say so; the on-device copy may just be empty (D10)
    if (!meta.fromCache) store.saveSettings({ lists: DEFAULT_LISTS });
    return;
  }
  state.lists = (Array.isArray(settings.lists) ? settings.lists : []).map(toList);
  state.listsLoaded = true;
  if (state.view !== 'all' && !listById(state.view)) return actions.setView('all');   // its list was deleted (D25)
  render();
  renderPickers();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
const $ = selector => document.querySelector(selector);
const esc = value => String(value).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);   // all user text goes through this (D26)
const onList = (task, view) => view === 'all' || task.lists.includes(view);
// A list's rows: its tasks and projects, plus subtasks on it whose project isn't. In All, subtasks stay under their project (D32).
const rowsOf = view => state.tasks.filter(t => onList(t, view) && !(parentOf(t) && onList(parentOf(t), view)));
const byPriority = (a, b) => a.prio - b.prio || b.created - a.created;   // D12
const euros = cents => (cents / 100).toLocaleString(undefined, { style: 'currency', currency: 'EUR' });

function render() {
  $('#tabs').innerHTML = [{ id: 'all', name: 'All', color: 'var(--ink)' }, ...state.lists].map(list => {
    const n = rowsOf(list.id).filter(t => !t.done).length;
    return `<button class="tab" data-act="view" data-view="${esc(list.id)}" style="--c:${list.color}"
      ${list.id === state.view ? 'aria-current="page"' : ''}><span class="tab-name" data-text="${esc(list.name)}">${esc(list.name)}</span>${n ? `<sup>${n}</sup>` : ''}</button>`;
  }).join('') + (state.listsLoaded
    ? '<button class="tab-add" data-act="editLists" aria-label="Add or edit lists" title="Add or edit lists">+</button>' : '');

  const current = listById(state.view), project = shownProject();
  $('#add-title').placeholder = project ? 'Add a subtask' : current ? `Add to ${current.name}` : 'Add a task';
  $('#project-head').hidden = !project;
  if (project) $('#project-head').innerHTML = projectHeadHTML(project);
  const shown = project ? subtasksOf(project.id) : rowsOf(state.view);
  const todo = shown.filter(t => !t.done).sort(byPriority);
  const done = shown.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);
  $('#list').innerHTML = !state.loaded ? '' : todo.length ? groupsHTML(todo) : `<li class="empty">${project ? 'No subtasks yet. Add one above.'
    : `${current ? `Nothing in ${esc(current.name)}.` : 'Nothing to do.'} Add a task above.`}</li>`;
  const priced = [...todo, ...todo.flatMap(t => t.project ? subtasksOf(t.id).filter(s => !s.done) : [])].filter(t => t.price !== null);
  $('#total').hidden = !priced.length;   // D33
  $('#total').textContent = `Total ${euros(priced.reduce((sum, t) => sum + t.price, 0))}`;
  $('#done-box').hidden = !done.length;
  $('#done-summary').textContent = `Done (${done.length})`;
  $('#done-list').innerHTML = done.map(t => taskHTML(t)).join('');

  $('#status').hidden = !state.offline;
  $('#status').textContent = state.queued ? 'Offline. Your changes will sync when you reconnect.' : 'Offline. Showing your last synced list.';
  $('#who').textContent = state.user?.email ? `Signed in as ${state.user.email}` : '';
}

const groupsHTML = tasks => PRIOS.map(p => {   // open tasks by priority, each group under a labelled line (D34)
  const group = tasks.filter(t => t.prio === p.id);
  return group.length ? `<li class="group">${p.label}</li>${group.map(t => taskHTML(t)).join('')}` : '';
}).join('');

function taskHTML(t, nested = false) {   // nested: a subtask shown under its project
  const id = esc(t.id), subs = t.project ? subtasksOf(t.id) : [];
  const open = subs.filter(s => !s.done).sort(byPriority);
  const expanded = !t.done && open.length > 0 && state.expanded.has(t.id);
  const aside = t.project ? (subs.length ? `${subs.length - open.length}/${subs.length}` : 'Project') : t.price === null ? '' : euros(t.price);
  return `<li class="task p${t.prio}${t.done ? ' done' : ''}">
    <button class="check" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.title)}" data-act="toggle" data-id="${id}"></button>
    <div class="col">
      <div class="line">
        <button class="body" data-act="${t.project ? 'open' : 'edit'}" data-id="${id}"><span class="title">${esc(t.title)}</span>${tagsHTML(t, nested)}</button>
        ${aside && `<span class="aside">${aside}</span>`}
        ${!t.done && open.length ? `<button class="expand" data-act="expand" data-id="${id}" aria-expanded="${expanded}" aria-label="Subtasks of ${esc(t.title)}"></button>` : ''}
      </div>
      ${expanded ? `<ul class="subs">${open.map(s => taskHTML(s, true)).join('')}</ul>` : ''}
    </div>
  </li>`;
}

function tagsHTML(t, nested = false) {   // the *other* lists it's on (D22); for a subtask on its own, its project (D32)
  const page = shownProject(), parent = !nested && !page && parentOf(t);
  const tags = t.lists.filter(id => page || id !== state.view).map(listById).filter(Boolean)
    .map(list => `<span class="tag" style="--c:${list.color}">${esc(list.name)}</span>`);
  if (parent) tags.unshift(`<span class="tag in">${esc(parent.title)}</span>`);
  return tags.length ? `<span class="tags">${tags.join('')}</span>` : '';
}

function projectHeadHTML(p) {   // D32
  const id = esc(p.id);
  return `<div class="crumb"><button data-act="back">← ${esc(listById(state.view)?.name ?? 'All')}</button>
      <button data-act="edit" data-id="${id}">Edit</button></div>
    <div class="task p${p.prio}${p.done ? ' done' : ''}">
      <button class="check" role="checkbox" aria-checked="${p.done}" aria-label="${esc(p.title)}" data-act="toggle" data-id="${id}"></button>
      <div class="col"><h1 class="title">${esc(p.title)}</h1>${tagsHTML(p)}</div>
    </div>
    ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : ''}`;
}

function pickersHTML(pick, target) {   // shared by the composer ('draft') and the task editor ('editing')
  const lists = state.lists.map(l => `<button type="button" class="chip" style="--c:${l.color}" data-act="pickList" data-for="${target}"
    data-list="${esc(l.id)}" aria-pressed="${pick.lists.includes(l.id)}">${esc(l.name)}</button>`).join('');
  const prios = PRIOS.map(p => `<button type="button" class="prio p${p.id}" data-act="pickPrio" data-for="${target}"
    data-prio="${p.id}" aria-pressed="${pick.prio === p.id}"><span class="title">${p.label}</span></button>`).join('');
  return `<div class="chips" role="group" aria-label="Lists">${lists}</div><div class="prios" role="group" aria-label="Priority">${prios}</div>`;
}

function renderPickers() {
  $('#add-opts').innerHTML = pickersHTML(state.draft, 'draft');
  if (state.editing) $('#edit-opts').innerHTML = pickersHTML(state.editing, 'editing');
}

function openEditor(id) {
  const task = byId(id);
  if (!task) return;
  state.editing = { id, lists: [...task.lists], prio: task.prio };
  $('#edit-title').value = task.title;
  $('#edit-notes').value = task.notes;
  $('#edit-notes').hidden = !task.project;                            // only projects have a description (D32)
  $('#edit-price').value = task.price === null ? '' : (task.price / 100).toFixed(2);
  $('#edit-price').setCustomValidity('');
  $('#make-project').hidden = task.project || Boolean(parentOf(task));  // one level: subtasks stay tasks
  $('#editor').setAttribute('aria-label', task.project ? 'Edit project' : 'Edit task');
  renderPickers();
  $('#editor').showModal();
  $('#edit-opts .chip, #edit-opts .prio').focus();   // a button, not the text field, so phones don't pop up the keyboard
}

function renderListsEditor() {
  const last = state.listsDraft.length - 1;
  $('#lists-rows').innerHTML = state.listsDraft.map((list, i) => `<li class="list-row">
    <button type="button" class="swatch" style="--c:${list.color}" data-act="pickColor" data-i="${i}" aria-label="Change color" aria-expanded="${state.picking === i}"></button>
    <input class="field" data-i="${i}" value="${esc(list.name)}" placeholder="New list" aria-label="List name" maxlength="40" autocomplete="off" enterkeyhint="done">
    <button type="button" class="icon-btn" data-act="moveList" data-i="${i}" data-by="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button type="button" class="icon-btn" data-act="moveList" data-i="${i}" data-by="1" aria-label="Move down" ${i === last ? 'disabled' : ''}>↓</button>
    <button type="button" class="icon-btn" data-act="dropList" data-i="${i}" aria-label="Delete list" ${list.id === SHOPPING_LIST ? 'disabled' : ''}>×</button>
    ${state.picking === i ? `<div class="colors" role="group" aria-label="Colors">${PALETTE.map((color, n) => `<button type="button"
      style="--c:${color}" data-act="setColor" data-i="${i}" data-color="${color}" aria-label="Color ${n + 1}" aria-pressed="${color === list.color}"></button>`).join('')}</div>` : ''}
  </li>`).join('');
}

function addDraftList() {
  const used = state.listsDraft.map(list => list.color);
  const color = PALETTE.find(c => !used.includes(c)) ?? PALETTE[used.length % PALETTE.length];
  state.listsDraft.push({ id: crypto.randomUUID().slice(0, 8), name: '', color });
  renderListsEditor();
  $('#lists-rows li:last-child input').focus();
}

function openListsEditor() {
  state.listsDraft = state.lists.map(list => ({ ...list }));
  state.picking = null;
  $('#lists-editor').showModal();
  addDraftList();   // "+" means add: start with an empty row. Blank rows are dropped on save (D9)
}

function show(screen) {
  for (const id of ['boot', 'login', 'main']) $(`#${id}`).hidden = id !== screen;
}

let toastTimer;
function toast(message) {
  Object.assign($('#toast'), { textContent: message, hidden: false });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 6000);
}

const MESSAGES = {
  'app/config-missing': "Couldn't load firebase-config.js. Check that it's uploaded next to index.html.",
  'app/config-empty': 'Add your Firebase settings to firebase-config.js (README, step 2).',
  'app/sdk-offline': "Couldn't load Firebase. Open the app once while online so this device keeps a copy.",
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/wrong-password': 'Wrong email or password.',
  'auth/user-not-found': 'Wrong email or password.',
  'auth/invalid-email': "That doesn't look like an email address.",
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes, then try again.',
  'auth/network-request-failed': 'No connection. Signing in needs the internet.',
  'permission-denied': 'The database refused access. Check that firestore.rules is published with your UID (README, step 5).',
  'not-found': 'That task no longer exists. It was probably deleted on another device.',
};
const explain = err => MESSAGES[err?.code] ?? `Something went wrong (${err?.code || err?.message || err}).`;

// ─── EVENTS ──────────────────────────────────────────────────────────────────
const clicks = {   // buttons say what they do with data-act="…"
  view: el => actions.setView(el.dataset.view),
  toggle: el => {   // show the tick first, then move the task (D24)
    const ticking = el.getAttribute('aria-checked') !== 'true', open = subtasksOf(el.dataset.id).filter(t => !t.done).length;
    if (ticking && open && !confirm(`Complete this project and its ${open} open subtask${open > 1 ? 's' : ''}?`)) return;
    el.setAttribute('aria-checked', ticking);
    setTimeout(() => actions.toggle(el.dataset.id), 350);
  },
  edit: el => openEditor(el.dataset.id),
  open: el => actions.openProject(el.dataset.id),
  back: () => actions.closeProject(),
  expand: el => actions.expand(el.dataset.id),
  makeProject: () => { const { id } = state.editing; $('#editor').close(); actions.makeProject(id); },
  pickList: el => {
    const pick = state[el.dataset.for], id = el.dataset.list;
    pick.lists = pick.lists.includes(id) ? pick.lists.filter(l => l !== id) : [...pick.lists, id];
    el.setAttribute('aria-pressed', pick.lists.includes(id));
    keepTyping(el);
  },
  pickPrio: el => {
    state[el.dataset.for].prio = Number(el.dataset.prio);
    for (const button of el.parentElement.children) button.setAttribute('aria-pressed', button === el);
    keepTyping(el);
  },
  deleteTask: () => {
    const n = subtasksOf(state.editing.id).length;
    if (!confirm(`Delete "${$('#edit-title').value}"${n ? ` and its ${n} subtask${n > 1 ? 's' : ''}` : ''}?`)) return;
    actions.remove(state.editing.id);
    $('#editor').close();
  },
  close: el => el.closest('dialog').close(),
  editLists: () => openListsEditor(),
  addList: () => addDraftList(),
  pickColor: el => {   // open or close this list's color grid (D35)
    const i = Number(el.dataset.i);
    state.picking = state.picking === i ? null : i;
    renderListsEditor();
    const row = $('#lists-rows').children[i];
    (row.querySelector('.colors [aria-pressed="true"]') ?? row.querySelector('.colors button') ?? row.querySelector('.swatch')).focus();
  },
  setColor: el => {
    const i = Number(el.dataset.i);
    state.listsDraft[i].color = el.dataset.color;
    state.picking = null;
    renderListsEditor();
    $('#lists-rows').children[i].querySelector('.swatch').focus();
  },
  moveList: el => {
    const i = Number(el.dataset.i), j = i + Number(el.dataset.by), rows = state.listsDraft;
    [rows[i], rows[j]] = [rows[j], rows[i]];
    state.picking = null;
    renderListsEditor();
    const row = $('#lists-rows').children[j];   // keep focus on the moved list
    (row.querySelector(`[data-by="${el.dataset.by}"]:enabled`) ?? row.querySelector('.swatch')).focus();
  },
  dropList: el => { state.listsDraft.splice(Number(el.dataset.i), 1); state.picking = null; renderListsEditor(); },
  backup: () => actions.backup(),
  restore: () => $('#restore-file').click(),
  signout: () => { unwatch?.(); unwatch = null; store.signOut(); },
};
// On a computer, put focus back in the new-task field so Enter still adds. (On a phone that would reopen the keyboard.)
const keepTyping = el => { if (el.dataset.for === 'draft' && matchMedia('(pointer: fine)').matches) $('#add-title').focus(); };

document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (el) clicks[el.dataset.act](el);
});
$('#add-title').addEventListener('input', event => $('#add').classList.toggle('typing', event.target.value.trim() !== ''));
for (const [field, target] of [['#add-price', 'draft'], ['#edit-price', 'editing']]) {
  let before = '';
  $(field).addEventListener('focus', event => { before = event.target.value.trim(); });
  $(field).addEventListener('input', event => {   // typing a price ticks To buy; untick it if you like (D33)
    const now = event.target.value.trim(), pick = state[target];
    event.target.setCustomValidity('');
    if (!before && now && listById(SHOPPING_LIST) && !pick.lists.includes(SHOPPING_LIST)) {
      pick.lists = [...pick.lists, SHOPPING_LIST];
      renderPickers();
    }
    before = now;
  });
}
function readPrice(field) {   // cents, null for none, or undefined after telling the user it isn't a number
  const price = parsePrice(field.value);
  field.setCustomValidity(Number.isNaN(price) ? 'Write the price as a number, like 4.50' : '');
  return field.reportValidity() ? price : undefined;
}
$('#add').addEventListener('submit', event => {
  event.preventDefault();
  const price = readPrice($('#add-price'));
  if (price === undefined || !actions.add($('#add-title').value, price)) return;
  $('#add-title').value = $('#add-price').value = '';
  $('#add').classList.remove('typing');
  renderPickers();
});
$('#edit-form').addEventListener('submit', event => {
  event.preventDefault();
  const price = readPrice($('#edit-price'));
  if (price === undefined) return;
  const { id, lists, prio } = state.editing;
  if (actions.save(id, { title: $('#edit-title').value, notes: $('#edit-notes').value, lists, prio, price })) $('#editor').close();
});
function route() {   // #p=<id> in the URL opens that project's page (D32)
  let id = null;
  try { id = decodeURIComponent(location.hash.match(/^#p=(.+)$/)?.[1] ?? '') || null; } catch {}
  if (!id) pushed = false;
  state.project = id;
  state.draft = freshDraft();
  render();
  renderPickers();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
$('#editor').addEventListener('close', () => { state.editing = null; });
$('#lists-rows').addEventListener('input', event => { state.listsDraft[event.target.dataset.i].name = event.target.value; });
$('#lists-form').addEventListener('submit', event => {
  event.preventDefault();
  if (actions.saveLists(state.listsDraft)) $('#lists-editor').close();
});
$('#lists-editor').addEventListener('close', () => { state.listsDraft = null; });
$('#restore-file').addEventListener('change', async event => {
  const [file] = event.target.files;
  event.target.value = '';   // so picking the same file again still works
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("That file isn't a Todo backup."); }
  actions.restore(data);
});
$('#login').addEventListener('submit', async event => {
  event.preventDefault();
  const { email, password } = event.target.elements, button = event.target.querySelector('button');
  $('#login-error').textContent = '';
  button.disabled = true;
  try { await store.signIn(email.value.trim(), password.value); }
  catch (err) { $('#login-error').textContent = explain(err); }
  finally { button.disabled = false; }
});

// ─── BOOT ────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline support unavailable:', err));
}
route();
try {
  store = await connectStore(err => toast(explain(err)));
  store.onUser(onUser);
} catch (err) {
  $('#boot').textContent = explain(err);
  show('boot');
  console.error(err);
}
</script>
</body>
</html>
